name: Pylint Assist

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Allow agent/user to trigger manually against any PR or branch
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull Request number to lint (leave empty to lint current branch)"
        required: false
        type: string
      format:
        description: "Output format"
        required: false
        default: "markdown"
        type: choice
        options:
          - markdown
          - text
          - json
      config_path:
        description: "Path to .linting-rules.yml (default: repo root)"
        required: false
        type: string
      post_comment:
        description: "Post results as a PR comment"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  lint:
    name: Run Pylint Assist
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: pip install -e .[dev]

      # -----------------------------------------------------------------------
      # PR trigger: lint changed files in the PR
      # -----------------------------------------------------------------------
      - name: Lint pull request (PR trigger)
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          lint-pr pr "$EVENT_PR_NUMBER" \
            --format markdown \
            --post-comment \
            --no-fail-on-warning || true

      # -----------------------------------------------------------------------
      # Manual dispatch: use pr_number if provided, else lint whole branch
      # -----------------------------------------------------------------------
      - name: Lint pull request (manual dispatch with PR number)
        if: github.event_name == 'workflow_dispatch' && inputs.pr_number != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Use env vars — never interpolate inputs directly into shell commands
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_FORMAT: ${{ inputs.format }}
          INPUT_POST_COMMENT: ${{ inputs.post_comment }}
          INPUT_CONFIG_PATH: ${{ inputs.config_path }}
        run: |
          if [ "$INPUT_POST_COMMENT" = "true" ]; then
            COMMENT_FLAG="--post-comment"
          else
            COMMENT_FLAG="--no-post-comment"
          fi
          if [ -n "$INPUT_CONFIG_PATH" ]; then
            lint-pr pr "$INPUT_PR_NUMBER" \
              --format "$INPUT_FORMAT" \
              "$COMMENT_FLAG" \
              --config "$INPUT_CONFIG_PATH" || true
          else
            lint-pr pr "$INPUT_PR_NUMBER" \
              --format "$INPUT_FORMAT" \
              "$COMMENT_FLAG" || true
          fi

      - name: Lint current branch files (manual dispatch, no PR)
        if: github.event_name == 'workflow_dispatch' && inputs.pr_number == ''
        env:
          INPUT_FORMAT: ${{ inputs.format }}
          INPUT_CONFIG_PATH: ${{ inputs.config_path }}
        run: |
          if [ -n "$INPUT_CONFIG_PATH" ]; then
            lint-pr files . \
              --format "$INPUT_FORMAT" \
              --config "$INPUT_CONFIG_PATH" || true
          else
            lint-pr files . \
              --format "$INPUT_FORMAT" || true
          fi

      # -----------------------------------------------------------------------
      # Generate and upload reports as artifacts
      # -----------------------------------------------------------------------
      - name: Generate JSON report
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          PR="${EVENT_PR_NUMBER:-$INPUT_PR_NUMBER}"
          if [ -n "$PR" ]; then
            lint-pr pr "$PR" \
              --format json \
              --no-post-comment \
              > lint-report.json 2>/dev/null || echo '{"summary":{},"results":[],"errors":[]}' > lint-report.json
          else
            lint-pr files . \
              --format json \
              > lint-report.json 2>/dev/null || echo '{"summary":{},"results":[],"errors":[]}' > lint-report.json
          fi

      - name: Generate Markdown report
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          PR="${EVENT_PR_NUMBER:-$INPUT_PR_NUMBER}"
          if [ -n "$PR" ]; then
            lint-pr pr "$PR" \
              --format markdown \
              --no-post-comment \
              > lint-report.md 2>/dev/null || echo "# Lint Report\n\nNo results available." > lint-report.md
          else
            lint-pr files . \
              --format markdown \
              --no-post-comment \
              > lint-report.md 2>/dev/null || echo "# Lint Report\n\nNo results available." > lint-report.md
          fi

      - name: Upload JSON lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-json
          path: lint-report.json
          retention-days: 14

      - name: Upload Markdown lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-markdown
          path: lint-report.md
          retention-days: 14
